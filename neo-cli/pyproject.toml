[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo"
version = "0.1.0"
description = "Unified package manager for Gentoo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "toml>=0.10",
    "pexpect>=4.8",
]

[project.scripts]
neo = "neo.cli:main"
