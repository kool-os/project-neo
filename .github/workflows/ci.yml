name: Ebuild Lint
on: [push, pull_request]
jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    container: gentoo/stage3:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pkgcheck
        run: emerge-webrsync && emerge pkgcheck
      - name: Run pkgcheck
        run: pkgcheck scan --exit-zero
